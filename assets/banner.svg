<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="1" />
    </linearGradient>

    <!-- Chart Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.5" />
    </pattern>

    <style>
      .chart-line {
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: drawLine 3.5s ease-out forwards;
      }
      .chart-fill {
        opacity: 0;
        animation: fadeInArea 2.5s ease-in 1s forwards;
      }
      .pulse-beacon {
        animation: beaconPulse 2.5s infinite ease-in-out;
      }
      .float-pill-1 {
        animation: floatPill 6s infinite ease-in-out alternate;
      }
      .float-pill-2 {
        animation: floatPill2 7s infinite ease-in-out alternate;
      }
      .float-pill-3 {
        animation: floatPill3 5.5s infinite ease-in-out alternate;
      }
      .shimmer-bar {
        animation: shimmer 4s infinite linear;
      }

      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeInArea {
        to { opacity: 1; }
      }
      @keyframes beaconPulse {
        0%, 100% { r: 5; opacity: 1; }
        50% { r: 11; opacity: 0.35; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes floatPill3 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-8px) rotate(1deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background depth) -->
  <circle cx="150" cy="100" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="220" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="360" r="200" fill="#8b5cf6" opacity="0.07" filter="url(#glow)" />

  <!-- ================= BACKGROUND ANIMATED DYNAMICS (Behind Content) ================= -->

  <!-- Subtle Financial Dynamic Line & Shaded Area -->
  <g opacity="0.65">
    <path class="chart-fill" d="M 0 320 Q 200 310, 350 260 T 650 210 T 950 140 T 1200 80 L 1200 380 L 0 380 Z" fill="url(#areaGrad)" />
    <path class="chart-line" d="M 0 320 Q 200 310, 350 260 T 650 210 T 950 140 T 1200 80" fill="none" stroke="url(#chartGrad)" stroke-width="3" filter="url(#softGlow)" />
    
    <!-- Moving Beacon Point on Trend -->
    <circle cx="950" cy="140" r="8" fill="#38bdf8" opacity="0.4" class="pulse-beacon" />
    <circle cx="950" cy="140" r="4.5" fill="#ffffff" />
  </g>

  <!-- Animated Floating Financial Indicator Badges (Positioned cleanly on sides/corners to protect foreground) -->
  <g class="float-pill-1" opacity="0.75">
    <rect x="940" y="45" width="200" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="960" cy="63" r="5" fill="#10b981" />
    <text x="975" y="68" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CAGR +14.8% • AUM</text>
  </g>

  <g class="float-pill-2" opacity="0.7">
    <rect x="60" y="50" width="180" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="80" cy="67" r="4.5" fill="#06b6d4" />
    <text x="95" y="72" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open-Source &amp; SaaS</text>
  </g>

  <g class="float-pill-3" opacity="0.65">
    <rect x="970" y="315" width="170" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="988" cy="332" r="4.5" fill="#a855f7" />
    <text x="1002" y="337" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">RIA &amp; Family Office</text>
  </g>

  <!-- ================= FOREGROUND HERO BRANDING (Guaranteed High Contrast & Visible) ================= -->

  <!-- Top Category Tag -->
  <g>
    <rect x="475" y="62" width="250" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="81" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title: Clear Foreground with Crisp Typography -->
  <!-- Subtle back-shadow for guaranteed separation -->
  <text x="600" y="162" text-anchor="middle" fill="#000000" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Awesome Wealth Management
  </text>
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Awesome Wealth Management
  </text>

  <!-- Gradient Underline Bar -->
  <rect x="420" y="184" width="360" height="4" rx="2" fill="url(#primaryGrad)" />

  <!-- Subtitle: Crystal Clear & High Contrast -->
  <text x="600" y="224" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
    Top FinTech SaaS Platforms, Open-Source Trackers &amp; Portfolio Analytics
  </text>

  <!-- Feature Pills Row (Foreground Center) -->
  <g transform="translate(240, 252)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Portfolio Trackers</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="265" y="20" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Automated Advisors</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="452" y="20" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💼 RIA Accounting</text>

    <!-- Pill 4 -->
    <rect x="550" y="0" width="170" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="635" y="20" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Local-First &amp; PTA</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
</svg>
